# Development override: MinIO (+ bucket init), mailpit, API with hot reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# App:      https://localhost          (mkcert certificate, see infra/certs/README.md)
# API docs: https://localhost/api/docs
# Mail:     http://localhost:8025      (mailpit)
# MinIO:    http://localhost:9001      (console)
# For UI hot reload run Vite on the host (`npm run dev:web`); it proxies /api to :3000.

services:
  proxy:
    volumes:
      - ./infra/nginx/dev-storage.conf:/etc/nginx/snippets/dev-storage.conf:ro

  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      SWAGGER_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      # Browsers reach MinIO through the proxy on the same origin (infra/nginx/dev-storage.conf).
      S3_PUBLIC_ENDPOINT: ${DEV_PUBLIC_ORIGIN:-https://localhost}
      S3_FORCE_PATH_STYLE: "true"
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/prisma:/repo/apps/api/prisma
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  db:
    ports:
      - "5432:5432"

  # Dev/test stand-in for OCI Object Storage (never in production).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  # Creates the private bucket once (idempotent).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-nuzli}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\" &&
      mc anonymous set none \"local/$$S3_BUCKET\" &&
      echo bucket ready"
    restart: "no"
    networks: [backend]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # Backups are a production concern; start with `--profile backup` to try them in dev.
  backup:
    profiles: ["backup"]

volumes:
  minio-data:
