# Development override: MinIO (+ bucket init), mailpit, API with hot reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# App:      https://localhost          (mkcert certificate, see infra/certs/README.md)
# API docs: https://localhost/api/docs
# Mail:     http://127.0.0.1:8025      (mailpit)
# MinIO:    http://127.0.0.1:9001      (console)
# For UI hot reload run Vite on the host (`npm run dev:web`); it proxies /api to 127.0.0.1:3000.
# Needs env/minio.env (copy env/minio.env.example) with the same keys as S3_* in env/api.env.
#
# Security review L10: every dev-only port is bound to 127.0.0.1. Phones on the LAN reach the
# app through the proxy (80/443) only; the API port is not exposed to the network, so nobody
# can bypass nginx and spoof X-Forwarded-For (TRUST_PROXY=1).

services:
  proxy:
    volumes:
      - ./infra/nginx/dev-storage.conf:/etc/nginx/snippets/dev-storage.conf:ro

  api:
    build:
      target: dev
    # Hot reload compiles into dist/ inside the container.
    read_only: false
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      SWAGGER_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      # Browsers reach MinIO through the proxy on the same origin (infra/nginx/dev-storage.conf).
      S3_PUBLIC_ENDPOINT: ${DEV_PUBLIC_ORIGIN:-https://localhost}
      S3_FORCE_PATH_STYLE: "true"
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/prisma:/repo/apps/api/prisma
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  db:
    ports:
      - "127.0.0.1:5432:5432"

  # Dev/test stand-in for OCI Object Storage (never in production).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - env/minio.env
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  # Creates the private bucket once (idempotent).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - env/minio.env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$${S3_BUCKET:-nuzli}\" &&
      mc anonymous set none \"local/$${S3_BUCKET:-nuzli}\" &&
      echo bucket ready"
    restart: "no"
    networks: [backend]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # A9 (ADR-111): the .mpp converter runs in dev too (needs env/converter.env). The API reaches
  # it at http://converter:8080 when env/api.env sets CONVERTER_URL and CONVERTER_TOKEN.
  converter:
    environment:
      CONVERTER_TIMEOUT_SECONDS: "50"

  # Backups are a production concern; start with `--profile backup` to try them in dev.
  backup:
    profiles: ["backup"]

volumes:
  minio-data:
