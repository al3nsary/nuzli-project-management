# Nuzli — base stack (brief §3.1). Combine with an override:
#   dev : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Configuration comes from .env (copy .env.example). HTTPS certificates: infra/certs/README.md.

name: nuzli

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-nuzli}
  POSTGRES_USER: ${POSTGRES_USER:-nuzli}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  # ───────────────────────────── Nginx: TLS, the built React app, /api → api
  proxy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: nuzli/proxy:${NUZLI_VERSION:-latest}
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ${CERTS_DIR:-./infra/certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, backend]

  # ───────────────────────────── NestJS API (migrate → seed → serve)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: nuzli/api:${NUZLI_VERSION:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1
      # Keep POSTGRES_PASSWORD URL-safe (letters, digits, - _ .) or set DATABASE_URL in .env.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-nuzli}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nuzli}?schema=public}
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  # ───────────────────────────── PostgreSQL 16
  db:
    image: postgres:16-alpine
    environment:
      <<: *db-env
      TZ: UTC
      PGTZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  # ───────────────────────────── Encrypted daily pg_dump (infra/backup)
  backup:
    build:
      context: infra/backup
    image: nuzli/backup:${NUZLI_VERSION:-latest}
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-nuzli}
      PGUSER: ${POSTGRES_USER:-nuzli}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

volumes:
  db-data:
  backups:

networks:
  edge:
  backend:
