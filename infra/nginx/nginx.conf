# Nuzli reverse proxy (image: nginxinc/nginx-unprivileged, runs as uid 101).
#  - :8080 (host :80)  → redirects to HTTPS (except /healthz and ACME challenges)
#  - :8443 (host :443) → TLS, serves the SPA, proxies /api to the API
# Certificates: /etc/nginx/certs/{fullchain,privkey}.pem (see infra/certs/README.md).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # $uri has no query string: set-password tokens never reach the access log.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time"}';
  access_log /dev/stdout json;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/manifest+json application/xml image/svg+xml;

  # Cache policy by path: hashed assets forever, the app shell and service worker never.
  map $uri $nz_cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~^/fonts/           "public, max-age=31536000, immutable";
    /sw.js              "no-cache";
    /index.html         "no-cache";
    /manifest.webmanifest "no-cache";
    ~^/api/             "";
    default             "public, max-age=3600";
  }

  # The SPA's CSP. The API sets its own (helmet), so nothing is added under /api/.
  # connect-src/img-src allow OCI Object Storage (presigned URLs) and OSM tiles (Leaflet).
  map $uri $nz_csp {
    ~^/api/  "";
    default  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.oraclecloud.com; font-src 'self'; connect-src 'self' https://*.oraclecloud.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
  }

  upstream nuzli_api {
    server api:3000;
    keepalive 16;
  }

  # ───────────────────────────────────────────── HTTP → HTTPS
  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ───────────────────────────────────────────── HTTPS
  server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads go straight to object storage with presigned URLs; API bodies stay small.
    client_max_body_size 2m;

    # Security headers on every response (an empty value suppresses the header).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy $nz_csp always;
    add_header Cache-Control $nz_cache_control always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://nuzli_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location ^~ /assets/ {
      access_log off;
      try_files $uri =404;
    }

    location = /sw.js {
      try_files $uri =404;
    }

    location = /index.html {
      try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app shell (client-side routing).
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Environment-specific additions (dev: MinIO behind the same origin).
    include /etc/nginx/snippets/*.conf;
  }
}
