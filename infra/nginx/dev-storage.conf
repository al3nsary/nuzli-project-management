# DEV ONLY (mounted by docker-compose.dev.yml into /etc/nginx/snippets/).
# Exposes the MinIO bucket on the same HTTPS origin, so presigned URLs work from phones on
# the LAN without mixed content. The API signs URLs for S3_PUBLIC_ENDPOINT=https://<host>,
# and the Host header is passed through unchanged so MinIO's signature check matches.
# The location must equal S3_BUCKET (default: nuzli). Production talks to OCI directly.
#
# Security review L10: an add_header in a location drops every inherited add_header, so the
# headers that matter for user-uploaded bytes served from the app origin are repeated here:
# nosniff (no content-type guessing) and a sandboxing CSP (an uploaded file can never run
# script with the app's origin).
location ^~ /nuzli/ {
  proxy_pass http://minio:9000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Connection "";
  proxy_request_buffering off;
  proxy_buffering off;
  # Imports may be 20 MB (MAX_IMPORT_BYTES, security review A9 L8); photos stay at 10 MB in the API.
  client_max_body_size 21m;
  proxy_hide_header Content-Security-Policy;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'none'; sandbox" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Referrer-Policy "no-referrer" always;
}
