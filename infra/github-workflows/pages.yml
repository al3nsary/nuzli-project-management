# GitHub Pages demo (ADR-020): the web app with the in-browser DemoApi, no server.
name: Pages (demo)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The repo currently carries an npm package-lock.json (ADR-022).
      - run: npm ci
      - run: npm run build -w @nuzli/shared
      - run: npm run check:i18n -w @nuzli/web
      - run: npm run build:demo -w @nuzli/web
      # SPA fallback: GitHub Pages serves 404.html for unknown paths.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
