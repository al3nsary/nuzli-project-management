# Production override: no MinIO (OCI Object Storage via S3_* in env/api.env), resource limits,
# restart policies, rotated logs.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Certificates: point CERTS_DIR at the Let's Encrypt live directory or provided certificates.
# Secrets: env/api.env, env/db.env, env/backup.env (ADR-068). Swagger stays off unless
# env/api.env sets SWAGGER_ENABLED=true explicitly (security review L5).
# Off-site backups: set BACKUP_S3_ENABLED=true and the BACKUP_S3_* values in env/backup.env
# (a separate bucket with write-only keys) — the upload is off by default.

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  proxy:
    <<: *restart
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  api:
    <<: *restart
    environment:
      NODE_ENV: production
      MAIL_TRANSPORT: smtp
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1G }
        reservations: { memory: 256M }

  db:
    <<: *restart
    # Postgres is reachable only inside the compose network (no published port).
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G }
        reservations: { memory: 512M }
    shm_size: 256m

  # A9 (ADR-111): .mpp conversion is CPU and memory heavy; cap it so it never starves the API.
  converter:
    <<: *restart
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M }

  backup:
    <<: *restart
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
